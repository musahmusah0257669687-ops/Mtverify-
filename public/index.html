<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MtVerify</title><style>
body {
  font-family: Arial, sans-serif;
  max-width: 600px;
  margin: auto;
  padding: 20px;
  background: #f5f5f5;
}

.box {
  background: white;
  padding: 20px;
  margin-bottom: 15px;
  border-radius: 12px;
}

h1 {
  text-align: center;
}

label {
  display: block;
  margin-top: 12px;
  margin-bottom: 6px;
  font-weight: bold;
}

input, select, button {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  box-sizing: border-box;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  background: #111;
  color: white;
  border: none;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

.operator-list {
  margin-top: 10px;
}

.operator-button {
  display: block;
  width: 100%;
  margin: 8px 0;
  padding: 14px;
  background: white;
  color: #111;
  border: 2px solid #ccc;
  text-align: left;
}

.operator-button.selected {
  border: 3px solid #111;
  background: #eee;
}

.operator-button:disabled {
  background: #ddd;
  color: #777;
  cursor: not-allowed;
}

.result {
  margin-top: 15px;
  padding: 12px;
  background: #eee;
  border-radius: 8px;
  white-space: pre-wrap;
  word-break: break-word;
}
</style></head><body><h1>MtVerify</h1><div class="box">
<h2>Customer Account</h2><label>Email</label>
<input id="email" type="email" placeholder="Enter your email">

<button onclick="checkBalance()">Check Balance</button>

<div id="balanceResult" class="result"></div>
</div><div class="box">
<h2>Add Balance</h2><label>Amount (GH₵)</label>
<input id="depositAmount" type="number" min="1" step="0.01" placeholder="Enter amount">

<button onclick="addBalance()">Pay with Paystack</button>

<div id="paymentResult" class="result"></div>
</div><div class="box">
<h2>Rent a Number</h2><label>Country</label>

<select id="country">
<option value="">Select country</option>
<option value="ghana">Ghana</option>
<option value="nigeria">Nigeria</option>
<option value="usa">United States</option>
<option value="uk">United Kingdom</option>
<option value="canada">Canada</option>
<option value="india">India</option>
<option value="germany">Germany</option>
<option value="france">France</option>
<option value="italy">Italy</option>
<option value="spain">Spain</option>
<option value="netherlands">Netherlands</option>
<option value="australia">Australia</option>
<option value="poland">Poland</option>
<option value="romania">Romania</option>
<option value="indonesia">Indonesia</option>
<option value="philippines">Philippines</option>
<option value="vietnam">Vietnam</option>
</select><label>Service</label>

<select id="product">
<option value="">Select service</option>
<option value="whatsapp">WhatsApp</option>
<option value="telegram">Telegram</option>
<option value="google">Google</option>
<option value="facebook">Facebook</option>
<option value="instagram">Instagram</option>
<option value="tiktok">TikTok</option>
<option value="twitter">Twitter</option>
<option value="microsoft">Microsoft</option>
<option value="discord">Discord</option>
<option value="uber">Uber</option>
<option value="amazon">Amazon</option>
<option value="snapchat">Snapchat</option>
</select><button onclick="checkPrice()">Check Price & Operators</button>

<h3>Choose Operator</h3><div id="operatorList" class="operator-list">
Please check price first.
</div><button onclick="rentNumber()">Rent Number</button>

<div id="priceResult" class="result"></div><div id="rentResult" class="result"></div></div><div class="box">
<h2>Check SMS</h2><label>Order ID</label>

<input id="orderId" type="text" placeholder="Enter order ID"><button onclick="checkSms()">Check SMS</button>

<div id="smsResult" class="result"></div>
</div><script>

let selectedOperator = "";


async function checkBalance() {

const email =
document.getElementById("email").value.trim();

if (!email) {
document.getElementById("balanceResult").textContent =
"Please enter your email.";
return;
}

try {

const response =
await fetch("/api/balance?email=" +
encodeURIComponent(email));

const data = await response.json();

if (!response.ok) {
throw new Error(data.error || "Unable to check balance.");
}

document.getElementById("balanceResult").textContent =
"Balance: GH₵" +
Number(data.balance).toFixed(2);

} catch(error) {

document.getElementById("balanceResult").textContent =
error.message;

}

}


async function addBalance() {

const email =
document.getElementById("email").value.trim();

const amount =
document.getElementById("depositAmount").value;

if (!email) {
document.getElementById("paymentResult").textContent =
"Please enter your email first.";
return;
}

if (!amount || Number(amount) <= 0) {
document.getElementById("paymentResult").textContent =
"Please enter a valid amount.";
return;
}

try {

const response =
await fetch("/api/paystack/initialize", {

method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify({
email: email,
amount: Number(amount)
})

});

const data = await response.json();

if (!response.ok) {
throw new Error(data.error || "Unable to start payment.");
}

window.location.href =
data.authorization_url;

} catch(error) {

document.getElementById("paymentResult").textContent =
error.message;

}

}


async function checkPrice() {

const country =
document.getElementById("country").value;

const product =
document.getElementById("product").value;

const operatorList =
document.getElementById("operatorList");

const result =
document.getElementById("priceResult");

selectedOperator = "";

if (!country || !product) {

operatorList.textContent =
"Please select a country and service.";

return;

}

operatorList.textContent =
"Loading operators...";

result.textContent = "";

try {

const response =
await fetch(
"/api/price?country=" +
encodeURIComponent(country) +
"&product=" +
encodeURIComponent(product)
);

const data =
await response.json();

if (!response.ok) {

throw new Error(
data.error ||
data.message ||
"Unable to check price."
);

}

const productData =
data[country] &&
data[country][product];

if (!productData) {

operatorList.textContent =
"No operators available.";

return;

}

operatorList.innerHTML = "";

const operators =
Object.keys(productData);

let available = 0;

operators.forEach(function(operator) {

const info =
productData[operator];

const count =
Number(info.count);

const price =
Number(info.cost);

const button =
document.createElement("button");

button.type = "button";

button.className =
"operator-button";

button.textContent =
operator +
" — Price: " +
info.cost +
" | Available: " +
info.count;

if (!Number.isFinite(count) || count <= 0) {

button.disabled = true;

button.textContent +=
" — Unavailable";

} else {

available++;

button.onclick = function() {

selectedOperator = operator;

document.querySelectorAll(
".operator-button"
).forEach(function(btn) {
btn.classList.remove("selected");
});

button.classList.add("selected");

result.textContent =
"Selected operator: " +
operator +
"\nPrice: " +
price +
"\nAvailable: " +
count;

};

}

operatorList.appendChild(button);

});


if (available === 0) {

operatorList.textContent =
"No numbers are currently available.";

}

} catch(error) {

operatorList.textContent =
error.message;

}

}


async function rentNumber() {

const email =
document.getElementById("email").value.trim();

const country =
document.getElementById("country").value;

const product =
document.getElementById("product").value;

const result =
document.getElementById("rentResult");

if (!email) {

result.textContent =
"Please enter your email.";

return;

}

if (!country || !product) {

result.textContent =
"Please select a country and service.";

return;

}

if (!selectedOperator) {

result.textContent =
"Please tap an available operator first.";

return;

}

result.textContent =
"Renting number...";

try {

const response =
await fetch("/api/buy", {

method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify({

email: email,

country: country,

product: product,

operator: selectedOperator

})

});

const data =
await response.json();

if (!response.ok) {

throw new Error(
data.error ||
"Unable to rent number."
);

}

const order =
data.order || {};

result.textContent =
"Number rented successfully!\n\n" +
"Phone number: " +
(order.phone || "Not provided") +
"\nOrder ID: " +
(order.id || "Not provided") +
"\nPrice: GH₵" +
Number(data.price || 0).toFixed(2) +
"\nRemaining balance: GH₵" +
Number(data.remainingBalance || 0).toFixed(2);

if (order.id) {

document.getElementById("orderId").value =
order.id;

}

} catch(error) {

result.textContent =
error.message;

}

}


async function checkSms() {

const orderId =
document.getElementById("orderId").value.trim();

const result =
document.getElementById("smsResult");

if (!orderId) {

result.textContent =
"Please enter an order ID.";

return;

}

result.textContent =
"Checking SMS...";

try {

const response =
await fetch(
"/api/order/" +
encodeURIComponent(orderId)
);

const data =
await response.json();

if (!response.ok) {

throw new Error(
data.error ||
data.message ||
"Unable to check SMS."
);

}

result.textContent =
JSON.stringify(data, null, 2);

} catch(error) {

result.textContent =
error.message;

}

}

</script></body>
</html>
