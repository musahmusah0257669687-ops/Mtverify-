<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MtVerify</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: 40px auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 36px;
    }

    .header p {
      color: #666;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #111;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      margin-top: 15px;
      padding: 15px;
      background: #f1f3f6;
      border-radius: 8px;
      white-space: pre-line;
      word-break: break-word;
    }

    .price-box {
      margin-top: 15px;
      padding: 15px;
      background: #eef7ee;
      border-radius: 8px;
      white-space: pre-line;
      word-break: break-word;
    }

    .hidden {
      display: none;
    }

    footer {
      text-align: center;
      margin-top: 25px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>MtVerify</h1>
      <p>Virtual number verification service</p>
    </div>

    <div class="card">

      <label for="country">Country</label>
      <input
        id="country"
        type="text"
        placeholder="Example: england"
      >

      <label for="service">Service</label>
      <input
        id="service"
        type="text"
        placeholder="Example: telegram"
      >

      <button id="priceButton">
        Check Price & Operators
      </button>

      <label for="operator">Choose Operator</label>
      <select id="operator" disabled>
        <option value="">Check price first</option>
      </select>

      <div id="priceResult" class="price-box">
        Enter a country and service, then tap "Check Price & Operators".
      </div>

      <button id="rentButton" disabled>
        Rent Number
      </button>

      <div id="result" class="result">
        Ready.
      </div>

      <div id="orderSection" class="hidden">

        <button id="checkButton">
          Check SMS
        </button>

        <div id="smsResult" class="result">
          Waiting for SMS...
        </div>

      </div>

    </div>

    <footer>
      MtVerify © 2026 — For lawful verification and testing purposes.
    </footer>

  </div>

  <script>

    let orderId = null;

    let availableOperators = {};

    const countryInput =
      document.getElementById("country");

    const serviceInput =
      document.getElementById("service");

    const operatorSelect =
      document.getElementById("operator");

    const priceButton =
      document.getElementById("priceButton");

    const rentButton =
      document.getElementById("rentButton");

    const checkButton =
      document.getElementById("checkButton");

    const priceResult =
      document.getElementById("priceResult");

    const result =
      document.getElementById("result");

    const smsResult =
      document.getElementById("smsResult");

    const orderSection =
      document.getElementById("orderSection");


    // CHECK PRICE AND LOAD OPERATORS
    priceButton.addEventListener("click", async () => {

      const country =
        countryInput.value.trim().toLowerCase();

      const product =
        serviceInput.value.trim().toLowerCase();

      if (!country || !product) {
        priceResult.textContent =
          "Please enter the country and service first.";
        return;
      }

      priceButton.disabled = true;
      rentButton.disabled = true;

      operatorSelect.disabled = true;

      priceResult.textContent =
        "Checking current prices and operators...";

      try {

        const response = await fetch(
          `/api/price?country=${encodeURIComponent(country)}&product=${encodeURIComponent(product)}`
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            data.message ||
            "Unable to check price."
          );
        }

        const countryData = data[country];

        const productData =
          countryData && countryData[product];

        if (!productData) {

          priceResult.textContent =
            "No price or availability was found for this country and service.";

          operatorSelect.innerHTML =
            '<option value="">No operators available</option>';

          return;
        }

        availableOperators = productData;

        const operators =
          Object.entries(productData);

        if (operators.length === 0) {

          priceResult.textContent =
            "No operators are currently available.";

          operatorSelect.innerHTML =
            '<option value="">No operators available</option>';

          return;
        }


        // CLEAR OLD OPERATORS
        operatorSelect.innerHTML = "";

        // ADD OPERATORS TO DROPDOWN
        operators.forEach(([operator, info]) => {

          const option =
            document.createElement("option");

          option.value = operator;

          option.textContent =
            `${operator} — Price: ${info.cost} — Available: ${info.count}`;

          operatorSelect.appendChild(option);

        });

        operatorSelect.disabled = false;


        // SHOW FIRST OPERATOR
        updateSelectedPrice();


      } catch (error) {

        priceResult.textContent =
          "Error: " + error.message;

        operatorSelect.innerHTML =
          '<option value="">Unable to load operators</option>';

      } finally {

        priceButton.disabled = false;

      }

    });


    // UPDATE PRICE WHEN OPERATOR CHANGES
    operatorSelect.addEventListener(
      "change",
      updateSelectedPrice
    );


    function updateSelectedPrice() {

      const operator =
        operatorSelect.value;

      if (!operator || !availableOperators[operator]) {

        rentButton.disabled = true;

        return;
      }

      const info =
        availableOperators[operator];

      let text =
        `Selected operator: ${operator}\n` +
        `Price: ${info.cost}\n` +
        `Available: ${info.count}`;

      if (info.rate !== undefined) {
        text +=
          `\nSMS rate: ${info.rate}%`;
      }

      priceResult.textContent = text;

      // Only allow renting when a real operator is selected
      rentButton.disabled = false;

    }


    // RENT NUMBER USING EXACT SELECTED OPERATOR
    rentButton.addEventListener("click", async () => {

      const country =
        countryInput.value.trim().toLowerCase();

      const product =
        serviceInput.value.trim().toLowerCase();

      const operator =
        operatorSelect.value;

      if (!country || !product) {

        result.textContent =
          "Please enter the country and service first.";

        return;
      }

      if (!operator) {

        result.textContent =
          "Please select an operator first.";

        return;
      }

      // Make sure the selected operator still exists
      if (!availableOperators[operator]) {

        result.textContent =
          "Please check the price again and select an available operator.";

        return;
      }

      rentButton.disabled = true;

      result.textContent =
        `Requesting a number from ${operator}...`;

      orderSection.classList.add("hidden");

      try {

        const response = await fetch(
          "/api/buy",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              country: country,
              operator: operator,
              product: product
            })
          }
        );

        const data =
          await response.json();

        if (!response.ok) {

          throw new Error(
            data.error ||
            data.message ||
            "Unable to rent number."
          );

        }

        orderId = data.id;

        result.textContent =
          `Operator: ${operator}\n` +
          `Number: ${data.phone || "Not provided"}\n` +
          `Order ID: ${data.id}\n` +
          `Status: ${data.status || "active"}`;

        orderSection.classList.remove("hidden");

        smsResult.textContent =
          "Waiting for SMS verification code...";

      } catch (error) {

        result.textContent =
          "Error: " + error.message;

      } finally {

        rentButton.disabled = false;

      }

    });


    // CHECK SMS
    checkButton.addEventListener("click", async () => {

      if (!orderId) {

        smsResult.textContent =
          "No active order found.";

        return;
      }

      checkButton.disabled = true;

      smsResult.textContent =
        "Checking for SMS...";

      try {

        const response = await fetch(
          `/api/order/${encodeURIComponent(orderId)}`
        );

        const data =
          await response.json();

        if (!response.ok) {

          throw new Error(
            data.error ||
            data.message ||
            "Unable to check SMS."
          );

        }

        if (data.sms && data.sms.length > 0) {

          const messages =
            data.sms.map(message => {

              return (
                `Sender: ${message.sender || "Unknown"}\n` +
                `Message: ${message.text || ""}`
              );

            });

          smsResult.textContent =
            messages.join("\n\n");

        } else {

          smsResult.textContent =
            "No SMS received yet. Try again in a few seconds.";

        }

      } catch (error) {

        smsResult.textContent =
          "Error: " + error.message;

      } finally {

        checkButton.disabled = false;

      }

    });

  </script>

</body>
</html>
