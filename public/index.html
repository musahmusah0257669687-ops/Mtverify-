<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MtVerify</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }.box {
  background: white;
  padding: 20px;
  margin-bottom: 15px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

h1 {
  text-align: center;
}

label {
  display: block;
  margin-top: 12px;
  margin-bottom: 5px;
  font-weight: bold;
}

input, select, button {
  width: 100%;
  padding: 12px;
  box-sizing: border-box;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  margin-top: 12px;
  cursor: pointer;
  background: #111;
  color: white;
  border: none;
}

button:hover {
  opacity: 0.9;
}

.result {
  margin-top: 15px;
  padding: 12px;
  background: #f0f0f0;
  border-radius: 8px;
  white-space: pre-wrap;
  word-break: break-word;
}

  </style>
</head><body>  <h1>MtVerify</h1>  <div class="box">
    <h2>Customer Account</h2><label>Email</label>
<input id="email" type="email" placeholder="Enter your email">

<button onclick="checkBalance()">Check Balance</button>

<div id="balanceResult" class="result"></div>

  </div>  <div class="box">
    <h2>Add Balance</h2><label>Amount (GH₵)</label>
<input id="depositAmount" type="number" min="1" step="0.01" placeholder="Enter amount">

<button onclick="addBalance()">Pay with Paystack</button>

<div id="paymentResult" class="result"></div>

  </div>  <div class="box">
    <h2>Rent a Number</h2><label>Country</label>
<select id="country">
  <option value="">Select country</option>
  <option value="ghana">Ghana</option>
  <option value="nigeria">Nigeria</option>
  <option value="usa">United States</option>
  <option value="uk">United Kingdom</option>
  <option value="canada">Canada</option>
  <option value="india">India</option>
  <option value="germany">Germany</option>
  <option value="france">France</option>
  <option value="italy">Italy</option>
  <option value="spain">Spain</option>
  <option value="netherlands">Netherlands</option>
  <option value="australia">Australia</option>
  <option value="poland">Poland</option>
  <option value="romania">Romania</option>
  <option value="indonesia">Indonesia</option>
  <option value="philippines">Philippines</option>
  <option value="vietnam">Vietnam</option>
</select>

<label>Service</label>
<select id="product">
  <option value="">Select service</option>
  <option value="whatsapp">WhatsApp</option>
  <option value="telegram">Telegram</option>
  <option value="google">Google</option>
  <option value="facebook">Facebook</option>
  <option value="instagram">Instagram</option>
  <option value="tiktok">TikTok</option>
  <option value="twitter">Twitter</option>
  <option value="microsoft">Microsoft</option>
  <option value="discord">Discord</option>
  <option value="uber">Uber</option>
  <option value="amazon">Amazon</option>
  <option value="snapchat">Snapchat</option>
</select>

<label>Operator</label>
<select id="operator">
  <option value="any">Any operator</option>
</select>

<button onclick="checkPrice()">Check Price & Operators</button>

<button onclick="rentNumber()">Rent Number</button>

<div id="priceResult" class="result"></div>
<div id="rentResult" class="result"></div>

  </div>  <div class="box">
    <h2>Check SMS</h2><label>Order ID</label>
<input id="orderId" type="text" placeholder="Enter order ID">

<button onclick="checkSms()">Check SMS</button>

<div id="smsResult" class="result"></div>

  </div><script>
async function checkBalance() {
  const email = document.getElementById("email").value.trim();

  if (!email) {
    document.getElementById("balanceResult").textContent =
      "Please enter your email.";
    return;
  }

  try {
    const response = await fetch(
      "/api/balance?email=" + encodeURIComponent(email)
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Unable to check balance.");
    }

    document.getElementById("balanceResult").textContent =
      "Balance: GH₵" + Number(data.balance).toFixed(2);
  } catch (error) {
    document.getElementById("balanceResult").textContent =
      error.message;
  }
}

async function addBalance() {
  const email = document.getElementById("email").value.trim();
  const amount = document.getElementById("depositAmount").value;

  if (!email) {
    document.getElementById("paymentResult").textContent =
      "Please enter your email first.";
    return;
  }

  if (!amount || Number(amount) <= 0) {
    document.getElementById("paymentResult").textContent =
      "Please enter a valid amount.";
    return;
  }

  try {
    const response = await fetch("/api/paystack/initialize", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email,
        amount: Number(amount)
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Unable to start payment.");
    }

    window.location.href = data.authorization_url;
  } catch (error) {
    document.getElementById("paymentResult").textContent =
      error.message;
  }
}

async function checkPrice() {
  const country = document.getElementById("country").value;
  const product = document.getElementById("product").value;
  const operatorSelect = document.getElementById("operator");
  const result = document.getElementById("priceResult");

  if (!country || !product) {
    result.textContent = "Please select a country and service.";
    return;
  }

  result.textContent = "Checking current price...";

  try {
    const response = await fetch(
      "/api/price?country=" +
      encodeURIComponent(country) +
      "&product=" +
      encodeURIComponent(product)
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || data.message || "Unable to check price."
      );
    }

    const productData =
      data[country] && data[country][product];

    if (!productData) {
      operatorSelect.innerHTML =
        '<option value="any">Any operator</option>';

      result.textContent =
        "No operators are currently available for this selection.";
      return;
    }

    operatorSelect.innerHTML = "";

    const anyOption = document.createElement("option");
    anyOption.value = "any";
    anyOption.textContent = "Any operator";
    operatorSelect.appendChild(anyOption);

    const operators = Object.keys(productData);

    if (operators.length === 0) {
      result.textContent =
        "No operators are currently available.";
      return;
    }

    operators.forEach(function(operator) {
      const option = document.createElement("option");
      option.value = operator;
      option.textContent = operator;
      operatorSelect.appendChild(option);
    });

    let text = "Available operators:\n\n";

    operators.forEach(function(operator) {
      const info = productData[operator];

      text +=
        operator +
        " — Price: " +
        info.cost +
        " | Available: " +
        info.count +
        "\n";
    });

    result.textContent = text;

  } catch (error) {
    result.textContent = error.message;
  }
}

async function rentNumber() {
  const email = document.getElementById("email").value.trim();
  const country = document.getElementById("country").value;
  const product = document.getElementById("product").value;
  const operator = document.getElementById("operator").value;
  const result = document.getElementById("rentResult");

  if (!email) {
    result.textContent = "Please enter your email.";
    return;
  }

  if (!country || !product) {
    result.textContent =
      "Please select a country and service.";
    return;
  }

  result.textContent = "Renting number...";

  try {
    const response = await fetch("/api/buy", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email,
        country,
        product,
        operator
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Unable to rent number."
      );
    }

    const order = data.order || {};

    result.textContent =
      "Number rented successfully!\n\n" +
      "Phone number: " +
      (order.phone || "Not provided") +
      "\nOrder ID: " +
      (order.id || "Not provided") +
      "\nPrice: GH₵" +
      Number(data.price || 0).toFixed(2) +
      "\nRemaining balance: GH₵" +
      Number(data.remainingBalance || 0).toFixed(2);

    if (order.id) {
      document.getElementById("orderId").value = order.id;
    }

  } catch (error) {
    result.textContent = error.message;
  }
}

async function checkSms() {
  const orderId =
    document.getElementById("orderId").value.trim();

  const result =
    document.getElementById("smsResult");

  if (!orderId) {
    result.textContent = "Please enter an order ID.";
    return;
  }

  result.textContent = "Checking SMS...";

  try {
    const response = await fetch(
      "/api/order/" +
      encodeURIComponent(orderId)
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        data.message ||
        "Unable to check SMS."
      );
    }

    result.textContent =
      JSON.stringify(data, null, 2);

  } catch (error) {
    result.textContent = error.message;
  }
}
</script></body>
</html>
