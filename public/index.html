<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MtVerify</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #172033;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 30px 18px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 34px;
    }

    .header p {
      color: #667085;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd3df;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #172033;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .result {
      margin-top: 18px;
      padding: 15px;
      border-radius: 10px;
      background: #f4f6f8;
      white-space: pre-line;
    }

    .code {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      margin-top: 12px;
      letter-spacing: 4px;
    }

    .hidden {
      display: none;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #667085;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>MtVerify</h1>
    <p>Verification number service</p>
  </div>

  <div class="card">

    <label for="country">Country</label>
    <input
      id="country"
      type="text"
      placeholder="Example: england"
    >

    <label for="operator">Operator</label>
    <input
      id="operator"
      type="text"
      value="any"
      placeholder="Example: any"
    >

    <label for="service">Service</label>
    <input
      id="service"
      type="text"
      placeholder="Example: telegram"
    >

    <button id="rentButton">
      Rent Number
    </button>

    <div id="result" class="result">
      Enter your details and tap "Rent Number".
    </div>

    <div id="orderSection" class="hidden">

      <button id="checkButton">
        Check SMS
      </button>

      <div id="smsResult" class="result">
        Waiting for SMS...
      </div>

    </div>

  </div>

  <div class="footer">
    MtVerify — Use only for lawful verification and testing.
  </div>

</div>

<script>

let orderId = null;

const rentButton = document.getElementById("rentButton");
const checkButton = document.getElementById("checkButton");
const result = document.getElementById("result");
const smsResult = document.getElementById("smsResult");
const orderSection = document.getElementById("orderSection");

rentButton.addEventListener("click", async () => {

  const country =
    document.getElementById("country").value.trim();

  const operator =
    document.getElementById("operator").value.trim() || "any";

  const product =
    document.getElementById("service").value.trim();

  if (!country || !product) {
    result.textContent =
      "Please enter a country and service.";
    return;
  }

  rentButton.disabled = true;
  rentButton.textContent = "Requesting number...";

  result.textContent =
    "Contacting 5SIM...";

  try {

    const response = await fetch("/api/buy", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        country,
        operator,
        product
      })

    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || data.message || "Unable to rent number."
      );
    }

    orderId = data.id;

    result.textContent =
      "Number: " + (data.phone || "Unavailable") +
      "\nOrder ID: " + (data.id || "Unavailable") +
      "\nStatus: " + (data.status || "PENDING");

    orderSection.classList.remove("hidden");

  } catch (error) {

    result.textContent =
      "Error: " + error.message;

  } finally {

    rentButton.disabled = false;
    rentButton.textContent = "Rent Number";

  }

});


checkButton.addEventListener("click", async () => {

  if (!orderId) {
    smsResult.textContent =
      "No active order.";
    return;
  }

  checkButton.disabled = true;
  checkButton.textContent = "Checking...";

  try {

    const response =
      await fetch("/api/order/" + orderId);

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || data.message || "Unable to check order."
      );
    }

    let message =
      "Status: " + (data.status || "Unknown");

    if (data.sms && data.sms.length > 0) {

      const latest =
        data.sms[data.sms.length - 1];

      message +=
        "\n\nSMS received:\n" +
        (latest.text || "");

      if (latest.code) {

        message +=
          "\n\nVerification code:";

        smsResult.innerHTML =
          message +
          '<div class="code">' +
          latest.code +
          '</div>';

      } else {

        smsResult.textContent =
          message;

      }

    } else {

      message +=
        "\n\nNo SMS received yet.";

      smsResult.textContent =
        message;

    }

  } catch (error) {

    smsResult.textContent =
      "Error: " + error.message;

  } finally {

    checkButton.disabled = false;
    checkButton.textContent =
      "Check SMS";

  }

});

</script>

</body>
</html>
