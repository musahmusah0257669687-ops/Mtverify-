<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MtVerify</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: 30px auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 36px;
    }

    .header p {
      color: #666;
    }

    .card {
      background: white;
      padding: 24px;
      margin-bottom: 18px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .balance {
      font-size: 26px;
      font-weight: bold;
      margin-top: 8px;
    }

    .result {
      margin-top: 14px;
      padding: 14px;
      border-radius: 8px;
      background: #f1f3f6;
      white-space: pre-line;
      word-break: break-word;
    }

    .price {
      background: #eef7ee;
    }

    .hidden {
      display: none;
    }

    footer {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin: 25px 0;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>MtVerify</h1>
    <p>Virtual number verification service</p>
  </div>


  <!-- CUSTOMER ACCOUNT -->

  <div class="card">

    <h2>Customer Account</h2>

    <label for="email">Email Address</label>

    <input
      id="email"
      type="email"
      placeholder="you@example.com"
    >

    <button id="balanceButton">
      Check Balance
    </button>

    <div class="balance">
      Balance: GH₵<span id="balance">0.00</span>
    </div>

  </div>


  <!-- DEPOSIT -->

  <div class="card">

    <h2>Add Balance</h2>

    <label for="depositAmount">
      Deposit Amount (GH₵)
    </label>

    <input
      id="depositAmount"
      type="number"
      min="1"
      step="0.01"
      placeholder="Example: 50"
    >

    <button id="payButton">
      Pay with Paystack
    </button>

    <div id="paymentResult" class="result">
      Enter your email and deposit amount.
    </div>

  </div>


  <!-- RENT NUMBER -->

  <div class="card">

    <h2>Rent a Number</h2>

    <label for="country">
      Country
    </label>

    <input
      id="country"
      type="text"
      placeholder="Example: england"
    >

    <label for="service">
      Service
    </label>

    <input
      id="service"
      type="text"
      placeholder="Example: telegram"
    >

    <button id="priceButton">
      Check Price & Operators
    </button>

    <label for="operator">
      Choose Operator
    </label>

    <select id="operator" disabled>
      <option value="">
        Check price first
      </option>
    </select>

    <div id="priceResult" class="result price">
      Enter country and service, then check the price.
    </div>

    <button id="rentButton" disabled>
      Rent Number
    </button>

    <div id="result" class="result">
      Ready.
    </div>

    <div id="orderSection" class="hidden">

      <button id="checkButton">
        Check SMS
      </button>

      <div id="smsResult" class="result">
        Waiting for SMS...
      </div>

    </div>

  </div>


  <footer>
    MtVerify © 2026 — For lawful verification and testing purposes.
  </footer>

</div>


<script>

let orderId = null;
let availableOperators = {};


// ELEMENTS

const emailInput =
  document.getElementById("email");

const depositInput =
  document.getElementById("depositAmount");

const balanceDisplay =
  document.getElementById("balance");

const balanceButton =
  document.getElementById("balanceButton");

const payButton =
  document.getElementById("payButton");

const paymentResult =
  document.getElementById("paymentResult");

const countryInput =
  document.getElementById("country");

const serviceInput =
  document.getElementById("service");

const priceButton =
  document.getElementById("priceButton");

const operatorSelect =
  document.getElementById("operator");

const priceResult =
  document.getElementById("priceResult");

const rentButton =
  document.getElementById("rentButton");

const result =
  document.getElementById("result");

const orderSection =
  document.getElementById("orderSection");

const checkButton =
  document.getElementById("checkButton");

const smsResult =
  document.getElementById("smsResult");


// ===============================
// CHECK BALANCE
// ===============================

balanceButton.addEventListener("click", async () => {

  const email =
    emailInput.value.trim().toLowerCase();

  if (!email) {

    paymentResult.textContent =
      "Please enter your email address.";

    return;
  }

  balanceButton.disabled = true;

  try {

    const response = await fetch(
      `/api/balance?email=${encodeURIComponent(email)}`
    );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Unable to check balance."
      );
    }

    balanceDisplay.textContent =
      Number(data.balance).toFixed(2);

  } catch (error) {

    paymentResult.textContent =
      "Error: " + error.message;

  } finally {

    balanceButton.disabled = false;

  }

});


// ===============================
// PAYSTACK PAYMENT
// ===============================

payButton.addEventListener("click", async () => {

  const email =
    emailInput.value.trim().toLowerCase();

  const amount =
    Number(depositInput.value);

  if (!email) {

    paymentResult.textContent =
      "Please enter your email address.";

    return;
  }

  if (!Number.isFinite(amount) || amount <= 0) {

    paymentResult.textContent =
      "Please enter a valid deposit amount.";

    return;
  }

  payButton.disabled = true;

  paymentResult.textContent =
    "Starting Paystack payment...";

  try {

    const response = await fetch(
      "/api/paystack/initialize",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          email,
          amount
        })
      }
    );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Unable to start payment."
      );

    }

    // Save payment reference
    localStorage.setItem(
      "mtverify_reference",
      data.reference
    );

    localStorage.setItem(
      "mtverify_email",
      email
    );

    // Send customer to Paystack
    window.location.href =
      data.authorization_url;

  } catch (error) {

    paymentResult.textContent =
      "Payment error: " +
      error.message;

    payButton.disabled = false;

  }

});


// ===============================
// VERIFY PAYMENT AFTER RETURN
// ===============================

async function verifyReturnedPayment() {

  const reference =
    localStorage.getItem(
      "mtverify_reference"
    );

  const savedEmail =
    localStorage.getItem(
      "mtverify_email"
    );

  if (!reference) {
    return;
  }

  paymentResult.textContent =
    "Verifying your payment...";

  try {

    const response = await fetch(
      `/api/paystack/verify/${encodeURIComponent(reference)}`
    );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Payment verification failed."
      );

    }

    if (
      savedEmail &&
      data.email.toLowerCase() ===
      savedEmail.toLowerCase()
    ) {

      emailInput.value =
        savedEmail;

    }

    balanceDisplay.textContent =
      Number(data.balance).toFixed(2);

    paymentResult.textContent =
      `Payment successful!\n` +
      `Added: GH₵${Number(data.paidAmount).toFixed(2)}\n` +
      `Balance: GH₵${Number(data.balance).toFixed(2)}`;

    localStorage.removeItem(
      "mtverify_reference"
    );

    localStorage.removeItem(
      "mtverify_email"
    );

  } catch (error) {

    paymentResult.textContent =
      "Payment verification: " +
      error.message;

  }

}


// ===============================
// CHECK PRICE
// ===============================

priceButton.addEventListener("click", async () => {

  const country =
    countryInput.value.trim().toLowerCase();

  const product =
    serviceInput.value.trim().toLowerCase();

  if (!country || !product) {

    priceResult.textContent =
      "Please enter country and service.";

    return;
  }

  priceButton.disabled = true;

  rentButton.disabled = true;

  operatorSelect.disabled = true;

  priceResult.textContent =
    "Checking prices...";

  try {

    const response = await fetch(
      `/api/price?country=${encodeURIComponent(country)}&product=${encodeURIComponent(product)}`
    );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Unable to check price."
      );

    }

    const countryData =
      data[country];

    const productData =
      countryData &&
      countryData[product];

    if (!productData) {

      priceResult.textContent =
        "No operators are available.";

      operatorSelect.innerHTML =
        '<option value="">No operators</option>';

      return;
    }

    availableOperators =
      productData;

    const operators =
      Object.entries(productData);

    operatorSelect.innerHTML = "";

    operators.forEach(
      ([operator, info]) => {

        const option =
          document.createElement("option");

        option.value =
          operator;

        option.textContent =
          `${operator} — Price: ${info.cost} — Available: ${info.count}`;

        operatorSelect.appendChild(option);

      }
    );

    operatorSelect.disabled = false;

    updateSelectedPrice();

  } catch (error) {

    priceResult.textContent =
      "Error: " + error.message;

  } finally {

    priceButton.disabled = false;

  }

});


// ===============================
// OPERATOR CHANGE
// ===============================

operatorSelect.addEventListener(
  "change",
  updateSelectedPrice
);


function updateSelectedPrice() {

  const operator =
    operatorSelect.value;

  const info =
    availableOperators[operator];

  if (!operator || !info) {

    rentButton.disabled = true;

    return;
  }

  let text =
    `Selected operator: ${operator}\n` +
    `Price: ${info.cost}\n` +
    `Available: ${info.count}`;

  if (info.rate !== undefined) {

    text +=
      `\nSMS rate: ${info.rate}%`;

  }

  priceResult.textContent =
    text;

  rentButton.disabled =
    Number(info.count) <= 0;

}


// ===============================
// RENT NUMBER
// ===============================

rentButton.addEventListener(
  "click",
  async () => {

    const email =
      emailInput.value.trim().toLowerCase();

    const country =
      countryInput.value.trim().toLowerCase();

    const product =
      serviceInput.value.trim().toLowerCase();

    const operator =
      operatorSelect.value;

    if (!email) {

      result.textContent =
        "Enter your email address first.";

      return;
    }

    if (!operator) {

      result.textContent =
        "Please select an operator.";

      return;
    }

    const info =
      availableOperators[operator];

    if (!info) {

      result.textContent =
        "Please check the price again.";

      return;
    }

    rentButton.disabled = true;

    result.textContent =
      `Renting from ${operator}...`;

    try {

      const response = await fetch(
        "/api/buy",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            email,
            country,
            operator,
            product
          })
        }
      );

      const data =
        await response.json();

      if (!response.ok) {

        throw new Error(
          data.error ||
          "Unable to rent number."
        );

      }

      orderId =
        data.id;

      result.textContent =
        `Operator: ${operator}\n` +
        `Number: ${data.phone || "Not provided"}\n` +
        `Order ID: ${data.id}\n` +
        `Charged: ${data.charged}\n` +
        `Remaining balance: GH₵${Number(data.remainingBalance).toFixed(2)}`;

      balanceDisplay.textContent =
        Number(data.remainingBalance).toFixed(2);

      orderSection.classList.remove(
        "hidden"
      );

      smsResult.textContent =
        "Waiting for SMS...";

    } catch (error) {

      result.textContent =
        "Error: " + error.message;

    } finally {

      rentButton.disabled = false;

    }

  }
);


// ===============================
// CHECK SMS
// ===============================

checkButton.addEventListener(
  "click",
  async () => {

    if (!orderId) {

      smsResult.textContent =
        "No active order.";

      return;
    }

    checkButton.disabled = true;

    smsResult.textContent =
      "Checking for SMS...";

    try {

      const response =
        await fetch(
          `/api/order/${encodeURIComponent(orderId)}`
        );

      const data =
        await response.json();

      if (!response.ok) {

        throw new Error(
          data.error ||
          "Unable to check SMS."
        );

      }

      if (
        data.sms &&
        data.sms.length > 0
      ) {

        smsResult.textContent =
          data.sms
            .map(message =>
              `Sender: ${message.sender || "Unknown"}\n` +
              `Message: ${message.text || ""}`
            )
            .join("\n\n");

      } else {

        smsResult.textContent =
          "No SMS received yet. Try again.";

      }

    } catch (error) {

      smsResult.textContent =
        "Error: " + error.message;

    } finally {

      checkButton.disabled = false;

    }

  }
);


// Check whether we returned from Paystack
verifyReturnedPayment();

</script>

</body>
</html>
