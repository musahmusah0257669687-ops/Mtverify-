<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MtVerify</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: 40px auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 36px;
    }

    .header p {
      color: #666;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #111;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      margin-top: 15px;
      padding: 15px;
      background: #f1f3f6;
      border-radius: 8px;
      white-space: pre-line;
      word-break: break-word;
    }

    .hidden {
      display: none;
    }

    .price-box {
      margin-top: 15px;
      padding: 15px;
      background: #eef7ee;
      border-radius: 8px;
      white-space: pre-line;
    }

    footer {
      text-align: center;
      margin-top: 25px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>MtVerify</h1>
      <p>Virtual number verification service</p>
    </div>

    <div class="card">

      <label for="country">Country</label>
      <input
        id="country"
        type="text"
        placeholder="Example: england"
      >

      <label for="operator">Operator</label>
      <input
        id="operator"
        type="text"
        value="any"
        placeholder="Example: any"
      >

      <label for="service">Service</label>
      <input
        id="service"
        type="text"
        placeholder="Example: telegram"
      >

      <button id="priceButton">
        Check Price
      </button>

      <div id="priceResult" class="price-box">
        Enter a country and service, then tap "Check Price".
      </div>

      <button id="rentButton">
        Rent Number
      </button>

      <div id="result" class="result">
        Ready.
      </div>

      <div id="orderSection" class="hidden">

        <button id="checkButton">
          Check SMS
        </button>

        <div id="smsResult" class="result">
          Waiting for SMS...
        </div>

      </div>

    </div>

    <footer>
      MtVerify © 2026 — For lawful verification and testing purposes.
    </footer>

  </div>

  <script>

    let orderId = null;

    const countryInput = document.getElementById("country");
    const operatorInput = document.getElementById("operator");
    const serviceInput = document.getElementById("service");

    const priceButton = document.getElementById("priceButton");
    const rentButton = document.getElementById("rentButton");
    const checkButton = document.getElementById("checkButton");

    const priceResult = document.getElementById("priceResult");
    const result = document.getElementById("result");
    const smsResult = document.getElementById("smsResult");
    const orderSection = document.getElementById("orderSection");


    // CHECK PRICE
    priceButton.addEventListener("click", async () => {

      const country = countryInput.value.trim().toLowerCase();
      const product = serviceInput.value.trim().toLowerCase();

      if (!country || !product) {
        priceResult.textContent =
          "Please enter the country and service first.";
        return;
      }

      priceButton.disabled = true;
      priceResult.textContent = "Checking current price...";

      try {

        const response = await fetch(
          `/api/price?country=${encodeURIComponent(country)}&product=${encodeURIComponent(product)}`
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            data.message ||
            "Unable to check price."
          );
        }

        const countryData = data[country];
        const productData =
          countryData && countryData[product];

        if (!productData) {
          priceResult.textContent =
            "No price or availability was found for this country and service.";
          return;
        }

        const operators = Object.entries(productData);

        if (operators.length === 0) {
          priceResult.textContent =
            "No operators are currently available.";
          return;
        }

        const lines = operators.map(([operator, info]) => {

          let line =
            `${operator}\n` +
            `Price: ${info.cost}\n` +
            `Available: ${info.count}`;

          if (info.rate !== undefined) {
            line += `\nSMS rate: ${info.rate}%`;
          }

          return line;
        });

        priceResult.textContent =
          "Current prices:\n\n" +
          lines.join("\n\n");

      } catch (error) {

        priceResult.textContent =
          "Error: " + error.message;

      } finally {

        priceButton.disabled = false;
      }

    });


    // RENT NUMBER
    rentButton.addEventListener("click", async () => {

      const country = countryInput.value.trim().toLowerCase();
      const operator =
        operatorInput.value.trim().toLowerCase() || "any";
      const product = serviceInput.value.trim().toLowerCase();

      if (!country || !product) {
        result.textContent =
          "Please enter the country and service first.";
        return;
      }

      rentButton.disabled = true;
      result.textContent = "Requesting a number...";

      orderSection.classList.add("hidden");

      try {

        const response = await fetch("/api/buy", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            country,
            operator,
            product
          })

        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            data.message ||
            "Unable to rent number."
          );
        }

        orderId = data.id;

        result.textContent =
          `Number: ${data.phone || "Not provided"}\n` +
          `Order ID: ${data.id}\n` +
          `Status: ${data.status || "active"}`;

        orderSection.classList.remove("hidden");

        smsResult.textContent =
          "Waiting for SMS verification code...";

      } catch (error) {

        result.textContent =
          "Error: " + error.message;

      } finally {

        rentButton.disabled = false;
      }

    });


    // CHECK SMS
    checkButton.addEventListener("click", async () => {

      if (!orderId) {
        smsResult.textContent =
          "No active order found.";
        return;
      }

      checkButton.disabled = true;
      smsResult.textContent =
        "Checking for SMS...";

      try {

        const response = await fetch(
          `/api/order/${encodeURIComponent(orderId)}`
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            data.message ||
            "Unable to check SMS."
          );
        }

        if (data.sms && data.sms.length > 0) {

          const messages = data.sms.map(message => {

            return (
              `Sender: ${message.sender || "Unknown"}\n` +
              `Message: ${message.text || ""}`
            );

          });

          smsResult.textContent =
            messages.join("\n\n");

        } else {

          smsResult.textContent =
            "No SMS received yet. Try again in a few seconds.";

        }

      } catch (error) {

        smsResult.textContent =
          "Error: " + error.message;

      } finally {

        checkButton.disabled = false;
      }

    });

  </script>

</body>
</html>
